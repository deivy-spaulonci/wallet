spring.application.name=wallet

server.port=8083
#server.address=0.0.0.0

spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-seconds=900
security.jwt.issuer=fianceiro-api

spring.jpa.open-in-view=false

#app.path.payments.files=/media/d31vy/hd01/Pagamentos/Pagamentos_PF/

# Chave secreta em Base64 (mínimo de 256 bits / 32 bytes)
application.security.jwt.secret-key=${JWT_SECRET}

# Tempo de expiração em milissegundos (86400000 ms = 48 horas)
application.security.jwt.expiration=172800000